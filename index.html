<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포인트 배팅 게임</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d27;--mut:#6b7080;--ac:#4f46e5;--ok:#16a34a;--no:#dc2626;--bd:#e3e5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--card:#1e2029;--tx:#eceef6;--mut:#9a9fb2;--ac:#8b85ff;--ok:#4ade80;--no:#f87171;--bd:#2d3040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14151c;--card:#1e2029;--tx:#eceef6;--mut:#9a9fb2;--ac:#8b85ff;--ok:#4ade80;--no:#f87171;--bd:#2d3040;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.pts{font-size:34px;font-weight:700;color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{flex:1;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.sel{outline:3px solid var(--ac)}
button:disabled{opacity:.5}
.msg{min-height:24px;font-weight:600;margin-top:10px}
.ok{color:var(--ok)}.no{color:var(--no)}
ol{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}
li:last-child{border:0}
li.me{font-weight:700;color:var(--ac)}
.notice{font-size:12px;color:var(--mut);margin-top:8px}
.hide{display:none}
.adm{display:grid;grid-template-columns:1fr 84px auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.adm input{padding:7px 8px;font-size:14px}
.adm button{padding:7px 10px;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>🎲 포인트 베팅 게임</h1>
  <p class="sub">가상 포인트로만 즐기는 게임이에요. 실제 돈이나 상품은 걸리지 않아요.</p>

  <section class="card" id="join">
    <input id="nick" maxlength="10" placeholder="닉네임을 입력하세요 (최대 10자)">
    <div class="row" style="margin-top:10px"><button id="joinBtn">시작하기 (1,000P 지급)</button></div>
  </section>

  <section class="card hide" id="game">
    <div class="sub" id="who"></div>
    <div class="pts" id="pts">0P</div>
    <div class="sub" id="rec"></div>
    <input id="amt" type="text" placeholder="!배팅 100  (금액 또는 올인)" aria-label="베팅 명령어">
    <div class="row" style="margin-top:10px"><button id="go">베팅!</button></div>
    <div class="notice" id="odds"></div>
    <div class="msg" id="msg"></div>
    <div class="row" style="margin-top:6px"><button class="alt hide" id="reset">포인트 바닥났어요 · 다시 시작</button></div>
  </section>

  <section class="card">
    <strong>🏆 랭킹</strong>
    <ol id="rank"><li><span>불러오는 중…</span></li></ol>
    <div class="notice" id="notice"></div>
  </section>

  <div class="row" style="justify-content:center;margin-bottom:14px"><button class="alt" id="admBtn" style="flex:0 0 auto;padding:8px 14px;font-size:13px">🔒 관리자</button></div>

  <section class="card hide" id="admin">
    <strong>🛠 관리자 모드</strong>
    <div id="admList"></div>
    <div class="row" style="margin-top:10px"><button class="alt" id="admReset">전체 초기화</button><button class="alt" id="admOut">나가기</button></div>
  </section>
</main>

<script>
// Firebase Realtime Database 주소를 넣으면 모두가 함께 랭킹을 공유해요. 예: https://내프로젝트-default-rtdb.firebaseio.com
const FIREBASE_URL = "".replace(/\/+$/, "");
// 관리자 비밀번호의 SHA-256 해시예요. 기본 비밀번호는 admin1234 이니 꼭 바꿔서 쓰세요.
const ADMIN_HASH = "ac9689e2272427085e35b9d3e3e8bed88cb3434828b43b86fc0596cad4c6e270";
const START = 1000;
const WIN_RATE = 0.3; // 성공 확률 (0~1)
const PAYOUT = 2;     // 성공 시 건 금액의 몇 배를 얻는지
let db = false, uid = null, me = null, busy = false, isAdmin = false, allPlayers = [];
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("ko-KR");

function lsGet(){ try { return JSON.parse(localStorage.getItem("bet-me")); } catch(e){ return null; } }
function lsSet(){ try { localStorage.setItem("bet-me", JSON.stringify(me)); } catch(e){} }

async function save(){
  lsSet();
  if (db) {
    try { await fetch(FIREBASE_URL + "/players/" + uid + ".json", { method: "PUT", body: JSON.stringify({ uid, ...me, t: Date.now() }) }); }
    catch(e){ $("notice").textContent = "서버 저장에 실패했어요. 이 기기에만 기록돼요."; }
    loadRank();
  }
}

function showGame(){
  $("join").classList.add("hide");
  $("game").classList.remove("hide");
  render();
}

function render(){
  $("who").textContent = me.name + " 님";
  $("pts").textContent = fmt(me.points) + "P";
  $("rec").textContent = me.wins + "승 " + me.losses + "패";
  $("reset").classList.toggle("hide", me.points >= 10);
  $("go").disabled = me.points < 10;
}

function renderRank(list){
  const el = $("rank");
  el.textContent = "";
  if (!list.length) { const li = document.createElement("li"); li.textContent = "아직 참가자가 없어요"; el.append(li); return; }
  list.forEach((p, i) => {
    const li = document.createElement("li");
    if (p.uid === uid || (!uid && me && p.name === me.name)) li.className = "me";
    const a = document.createElement("span"), b = document.createElement("span");
    const medal = ["🥇","🥈","🥉"][i] || (i + 1) + "위";
    a.textContent = medal + " " + p.name;
    b.textContent = fmt(p.points) + "P";
    li.append(a, b); el.append(li);
  });
}

async function syncMe(){
  if (!FIREBASE_URL || !me) return true;
  try {
    const o = await (await fetch(FIREBASE_URL + "/players/" + uid + ".json")).json();
    if (o && o.name) { me = o; lsSet(); render(); return true; }
    me = null;
    try { localStorage.removeItem("bet-me"); } catch(e){}
    $("game").classList.add("hide"); $("join").classList.remove("hide");
    return false;
  } catch(e){ return true; }
}

async function sha(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

async function api(method, path, body){
  if (!FIREBASE_URL) { alert("서버 주소(FIREBASE_URL)를 먼저 설정해야 해요."); return; }
  try {
    await fetch(FIREBASE_URL + path + ".json", { method, body: body ? JSON.stringify(body) : undefined });
    await loadRank();
  } catch(e){ alert("요청에 실패했어요."); }
}

function renderAdmin(){
  const box = $("admList");
  box.textContent = "";
  if (!allPlayers.length) { box.textContent = "참가자가 없어요."; return; }
  allPlayers.forEach(p => {
    const row = document.createElement("div"); row.className = "adm";
    const name = document.createElement("span"); name.textContent = p.name + " (" + fmt(p.points) + "P)";
    const inp = document.createElement("input"); inp.type = "number"; inp.value = p.points; inp.min = 0;
    const ok = document.createElement("button"); ok.textContent = "적용";
    ok.onclick = () => api("PATCH", "/players/" + p.key, { points: Math.max(0, Math.floor(Number(inp.value) || 0)) });
    const del = document.createElement("button"); del.className = "alt"; del.textContent = "삭제";
    del.onclick = () => { if (confirm(p.name + " 님을 삭제할까요?")) api("DELETE", "/players/" + p.key); };
    row.append(name, inp, ok, del); box.append(row);
  });
}

function closeAdmin(){ isAdmin = false; $("admin").classList.add("hide"); $("admBtn").textContent = "🔒 관리자"; }

$("admBtn").onclick = async () => {
  if (isAdmin) { closeAdmin(); return; }
  const pw = prompt("관리자 비밀번호를 입력하세요");
  if (pw === null) return;
  if (!(window.crypto && crypto.subtle)) { alert("이 브라우저에서는 관리자 확인을 할 수 없어요. https 주소로 접속해 주세요."); return; }
  if ((await sha(pw)) !== ADMIN_HASH) { alert("비밀번호가 틀렸어요."); return; }
  isAdmin = true; $("admin").classList.remove("hide"); $("admBtn").textContent = "🔓 관리자 모드 켜짐";
  renderAdmin();
};
$("admOut").onclick = closeAdmin;
$("admReset").onclick = () => { if (confirm("모든 참가자 기록을 삭제할까요? 되돌릴 수 없어요.")) api("DELETE", "/players"); };

async function loadRank(){
  try {
    const r = await fetch(FIREBASE_URL + "/players.json");
    const o = (await r.json()) || {};
    allPlayers = Object.entries(o).filter(([k, p]) => p && p.name).map(([k, p]) => ({ ...p, key: k })).sort((x, y) => y.points - x.points);
    renderRank(allPlayers.slice(0, 20));
    if (isAdmin) renderAdmin();
  } catch(e){ $("notice").textContent = "랭킹을 불러오지 못했어요."; }
}

async function init(){
  me = lsGet();
  if (me) showGame();
  try { uid = localStorage.getItem("bet-uid"); if (!uid) { uid = "u" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem("bet-uid", uid); } } catch(e){ uid = "u" + Math.random().toString(36).slice(2, 10); }
  if (FIREBASE_URL) {
    db = true;
    if (me) await syncMe();
    loadRank(); setInterval(loadRank, 5000);
  } else {
    renderRank(me ? [{ ...me }] : []);
    $("notice").textContent = "서버 주소가 설정되지 않아 이 기기에서만 기록돼요.";
  }
}

$("joinBtn").onclick = async () => {
  const name = $("nick").value.trim();
  if (!name) { $("nick").focus(); return; }
  me = { name, points: START, wins: 0, losses: 0 };
  await save(); showGame();
  if (!(db && uid)) renderRank([{ ...me }]);
};

$("odds").textContent = "성공 확률 " + Math.round(WIN_RATE * 100) + "% · 성공하면 건 금액의 " + PAYOUT + "배 획득, 실패하면 잃어요.";
$("amt").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

$("go").onclick = async () => {
  if (busy) return;
  busy = true; const synced = await syncMe(); busy = false;
  if (!synced) { $("msg").className = "msg no"; $("msg").textContent = "관리자에 의해 초기화됐어요. 닉네임부터 다시 시작해 주세요."; return; }
  const raw = $("amt").value.replace(/^\s*!?(배팅|베팅)\s*/, "").trim();
  const amt = raw === "올인" ? me.points : Math.floor(Number(raw.replace(/,/g, "")));
  const m = $("msg");
  if (!(amt >= 10)) { m.className = "msg no"; m.textContent = "최소 10P부터 걸 수 있어요."; return; }
  if (amt > me.points) { m.className = "msg no"; m.textContent = "보유 포인트보다 많이 걸 수 없어요."; return; }
  busy = true;
  if (Math.random() < WIN_RATE) { me.points += amt * PAYOUT; me.wins++; m.className = "msg ok"; m.textContent = "🎉 성공! +" + fmt(amt * PAYOUT) + "P"; }
  else { me.points -= amt; me.losses++; m.className = "msg no"; m.textContent = "💥 실패… -" + fmt(amt) + "P"; }
  render();
  await save();
  if (!(db && uid)) renderRank([{ ...me }]);
  busy = false;
};

$("reset").onclick = async () => {
  me.points = START; render(); await save();
  if (!(db && uid)) renderRank([{ ...me }]);
};

init();
</script>
</body>
</html>
